<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=https://jonathanwarden.com">
    <link rel="canonical" href="https://jonathanwarden.com">
    <title>Redirecting to jonathanwarden.com</title>
    <script>
        // Preserve the current path and query string when redirecting
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var targetUrl = "https://jonathanwarden.com" + path + search + hash;
        window.location.href = targetUrl;
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://jonathanwarden.com">jonathanwarden.com</a>...</p>
</body>
</html>
